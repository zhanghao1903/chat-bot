[project]
name = "group-llm-agent"
version = "0.1.0"
description = "A minimal Telegram group fixed-reply service."
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
group-llm-agent = "group_llm_agent.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
group_llm_agent = ["persona_bundles/*/*/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
packages = ["group_llm_agent"]
disallow_untyped_defs = true
warn_return_any = true
